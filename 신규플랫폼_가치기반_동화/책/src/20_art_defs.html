<!-- ══════════════════════════════════════════════════════════════
     삽화 공통 정의 — 수채 + 색연필 화풍
       · 색면(.w) : 수채 번짐 + 가장자리 물고임 필터
       · 선(.ln)  : 연필 떨림 필터 · 따뜻한 갈색
       · 색면이 선 밖으로 살짝 넘쳐 손그림 느낌을 낸다
     캐릭터 기준 : 발끝 y=0 · 키 100 · 머리 지름 33

     ※ <defs> 안의 요소는 <use> 섀도 트리로 복제되므로
       문서 CSS의 클래스 선택자가 닿지 않는다.
       → defs 내부는 전부 인라인 style + var() 로 칠한다.
     ══════════════════════════════════════════════════════════ -->

.w{filter:url(#wc)}
.w2{filter:url(#wc2)}
.ln{filter:url(#pn);fill:none;stroke:#4A3A2C;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round}
.ln-t{stroke-width:1.15}
.pg{filter:url(#paper);opacity:.45;mix-blend-mode:multiply;pointer-events:none}
.hatch{fill:none;stroke:#6B4F38;stroke-opacity:.16;stroke-width:2;stroke-linecap:round}

    <feMerge><feMergeNode in="d"/><feMergeNode in="rimc"/></feMerge>
